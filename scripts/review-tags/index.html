<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>タグ確認ツール</title>
<style>
  :root {
    --bg: #faf7f8;
    --card: #ffffff;
    --border: #e8dde2;
    --text: #2b2129;
    --sub: #7a6b73;
    --accent: #d9668b;
    --accent-soft: #f7dde6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  header {
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  .progress { font-size: 13px; color: var(--sub); }
  .filter-toggle { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .layout {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 16px 80px;
  }
  .sidebar {
    flex: 0 0 260px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    position: sticky;
    top: 24px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .sidebar-item:last-child { border-bottom: none; }
  .sidebar-item:hover { background: #fdf5f8; }
  .sidebar-item.current { background: var(--accent-soft); }
  .sidebar-item img {
    width: 28px;
    height: 40px;
    object-fit: cover;
    border-radius: 3px;
    flex: 0 0 28px;
    background: #eee;
  }
  .sidebar-item .s-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sidebar-item .s-status { flex: 0 0 auto; font-size: 13px; }
  main {
    flex: 1;
    min-width: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    gap: 20px;
  }
  .cover { flex: 0 0 160px; }
  .cover img {
    width: 160px;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
    background: #f0f0f0;
    border: 1px solid var(--border);
  }
  .cover a { display: block; margin-top: 8px; font-size: 12px; color: var(--accent); text-decoration: none; }
  .details { flex: 1; min-width: 0; }
  .details h2 { margin: 0 0 4px; font-size: 18px; }
  .details .author { color: var(--sub); font-size: 13px; margin-bottom: 10px; }
  .details .meta { color: var(--sub); font-size: 12px; margin-bottom: 10px; }
  .description {
    font-size: 13px;
    line-height: 1.6;
    max-height: 140px;
    overflow-y: auto;
    white-space: pre-wrap;
    background: #fbf9fa;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 16px;
  }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 0 0 14px;
    padding: 10px 12px;
  }
  legend { font-size: 12px; color: var(--sub); padding: 0 4px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .swatch.on { background: var(--accent-soft); border-color: var(--accent); color: #8a2b52; }
  .swatch input { margin: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
  .radio-row { display: flex; gap: 14px; font-size: 13px; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); cursor: pointer; user-select: none; }
  .tag-chip.on { background: var(--accent-soft); border-color: var(--accent); color: #8a2b52; }
  .custom-tag-row { display: flex; gap: 6px; margin-top: 8px; }
  .custom-tag-row input { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button {
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; }
  button.danger { background: transparent; border-color: #c0392b; color: #c0392b; margin-left: auto; }
  button.danger:hover { background: #c0392b; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .empty { text-align: center; color: var(--sub); padding: 60px 0; }
  .memo { font-size: 11px; color: var(--sub); margin-top: 10px; }
  .saved-flash { color: #2a8a52; font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>

<header>
  <h1>タグ確認ツール</h1>
  <label class="filter-toggle">
    <input type="checkbox" id="filterToggle" checked />
    要確認のみ表示
  </label>
  <div class="progress" id="progress">読み込み中...</div>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <main id="main">
    <div class="empty">読み込み中...</div>
  </main>
</div>

<script>
const KNOWN_TAGS = [
  '溺愛','執着','スパダリ','オフィスラブ','年の差','幼馴染','同棲',
  '異世界・転生','オメガバース','獣人','ヤクザ','学園','王道ファンタジー',
  '医療系','刑事・警察','芸能・アイドル','契約・偽装関係','婚約・政略結婚',
];
const MAX_TAGS = 3; // トップページに常時表示する運用のため上限を設ける

// 似た意味の言葉を手入力しても既存タグに寄せ、同義タグが乱立しないようにする
const TAG_SYNONYMS = {
  '同居': '同棲',
  '医療': '医療系',
  '病院': '医療系',
  'ドクター': '医療系',
  '警察': '刑事・警察',
  '刑事': '刑事・警察',
  '極道': 'ヤクザ',
  '任侠': 'ヤクザ',
  'アイドル': '芸能・アイドル',
  '芸能人': '芸能・アイドル',
  '俳優': '芸能・アイドル',
  '転生': '異世界・転生',
  '異世界': '異世界・転生',
  'ファンタジー': '王道ファンタジー',
  '契約結婚': '契約・偽装関係',
  '偽装結婚': '契約・偽装関係',
  '偽装カップル': '契約・偽装関係',
  '政略結婚': '婚約・政略結婚',
  '見合い': '婚約・政略結婚',
};
function normalizeTag(raw) {
  return TAG_SYNONYMS[raw] ?? raw;
}
const COLORS = [
  ['pink', 'linear-gradient(135deg,#f5c4d2,#e78ba8)'],
  ['black', 'linear-gradient(135deg,#5a5560,#333333)'],
  ['blue', 'linear-gradient(135deg,#8fc0e6,#5b8ad1)'],
  ['yellow', 'linear-gradient(135deg,#f0dd8a,#e0c53f)'],
  ['green', 'linear-gradient(135deg,#9fd0a5,#5fa876)'],
  ['white', 'linear-gradient(135deg,#ffffff,#f3f3f3)'],
  ['red', 'linear-gradient(135deg,#e08a94,#c94f4f)'],
  ['brown', 'linear-gradient(135deg,#c0997a,#6f4e37)'],
  ['other', 'conic-gradient(from 0deg,#e78ba8,#e0c53f,#5fa876,#5b8ad1,#c94f4f,#e78ba8)'],
];
const PEOPLE = [['solo','ソロ'], ['duo','デュオ(2人)'], ['group','グループ']];
const FONTS = [['mincho','明朝'], ['gothic','ゴシック'], ['tegaki','手書き']];

let books = [];
let currentIndex = 0;
let currentTags = new Set();
let currentColors = new Set();
const MAX_COLORS = 2; // 表紙の主要カラーは最大2色まで登録できる

const mainEl = document.getElementById('main');
const sidebarEl = document.getElementById('sidebar');
const progressEl = document.getElementById('progress');
const filterToggle = document.getElementById('filterToggle');

async function loadBooks() {
  const res = await fetch('/api/books');
  books = await res.json();
  currentIndex = 0;
  render();
}

function visibleBooks() {
  return filterToggle.checked ? books.filter(b => b.needsReview) : books;
}

function render() {
  const list = visibleBooks();
  const total = books.length;
  const remaining = books.filter(b => b.needsReview).length;
  const confirmed = total - remaining;
  progressEl.textContent = `確認済み ${confirmed} / 全 ${total} 件（表示中 ${Math.min(currentIndex + 1, list.length)} / ${list.length}）`;

  if (list.length === 0) {
    mainEl.innerHTML = '<div class="empty">🎉 対象の本がありません(すべて確認済みかも)</div>';
    sidebarEl.innerHTML = '';
    return;
  }
  if (currentIndex >= list.length) currentIndex = list.length - 1;
  if (currentIndex < 0) currentIndex = 0;

  const book = list[currentIndex];
  currentTags = new Set(book.tags || []);
  currentColors = new Set(Array.isArray(book.mainColor) ? book.mainColor : [book.mainColor].filter(Boolean));
  renderSidebar(list, book);

  mainEl.innerHTML = `
    <div class="card">
      <div class="cover">
        <img src="${escapeAttr(book.coverUrl)}" alt="" onerror="this.style.opacity=0.2" />
        <a href="${escapeAttr(book.coverUrl)}" target="_blank" rel="noopener">表紙を別タブで開く</a>
      </div>
      <div class="details">
        <h2>${escapeHtml(book.title)}</h2>
        <div class="author">${escapeHtml(book.author || '著者不明')}</div>
        <div class="meta">${book.price ? '¥' + book.price : ''} ${book.publishedDate ? ' / ' + book.publishedDate : ''}</div>
        <div class="description">${escapeHtml(book.description || '(あらすじなし)')}</div>

        <fieldset>
          <legend>mainColor（最大2色）</legend>
          <div class="swatches" id="colorSwatches"></div>
        </fieldset>

        <fieldset>
          <legend>peopleCount</legend>
          <div class="radio-row" id="peopleRadios"></div>
        </fieldset>

        <fieldset>
          <legend>fontStyle（任意）</legend>
          <div class="radio-row" id="fontRadios"></div>
        </fieldset>

        <fieldset>
          <legend>tags</legend>
          <div class="tag-list" id="tagList"></div>
          <div class="custom-tag-row">
            <input type="text" id="customTagInput" placeholder="自由入力タグを追加してEnter" />
          </div>
        </fieldset>

        <div class="memo">${escapeHtml(book.memo || '')}</div>

        <div class="actions">
          <button class="ghost" id="prevBtn">← 前へ</button>
          <button class="primary" id="saveNextBtn">保存して確認済みにする →</button>
          <button class="ghost" id="skipBtn">スキップ(変更しない) →</button>
          <button class="danger" id="deleteBtn">この本を削除</button>
          <span class="saved-flash" id="savedFlash"></span>
        </div>
      </div>
    </div>
  `;

  const colorSwatches = document.getElementById('colorSwatches');
  COLORS.forEach(([key, hex]) => {
    const label = document.createElement('label');
    label.className = 'swatch' + (currentColors.has(key) ? ' on' : '');
    label.innerHTML = `<input type="checkbox" value="${key}" ${currentColors.has(key) ? 'checked' : ''}/><span class="dot" style="background:${hex}"></span>${key}`;
    const checkbox = label.querySelector('input');
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        if (currentColors.size >= MAX_COLORS) {
          checkbox.checked = false;
          alert(`mainColorは${MAX_COLORS}つまでです。外してから追加してください。`);
          return;
        }
        currentColors.add(key);
        label.classList.add('on');
      } else {
        currentColors.delete(key);
        label.classList.remove('on');
      }
    });
    colorSwatches.appendChild(label);
  });

  const peopleRadios = document.getElementById('peopleRadios');
  PEOPLE.forEach(([key, label]) => {
    const el = document.createElement('label');
    el.innerHTML = `<input type="radio" name="peopleCount" value="${key}" ${book.peopleCount===key?'checked':''}/> ${label}`;
    peopleRadios.appendChild(el);
  });

  const fontRadios = document.getElementById('fontRadios');
  const fontOptionsWithUnset = [['', '未設定'], ...FONTS];
  fontOptionsWithUnset.forEach(([key, label]) => {
    const el = document.createElement('label');
    const checked = (book.fontStyle || '') === key;
    el.innerHTML = `<input type="radio" name="fontStyle" value="${key}" ${checked ? 'checked' : ''}/> ${label}`;
    fontRadios.appendChild(el);
  });

  const tagList = document.getElementById('tagList');
  // サイト側のタグ絞り込みは実データから動的に生成されるため、ツールの候補も
  // 「これまでに使われた全タグ」+「辞書」+「この本のタグ」を合算して常に一致させる
  const allUsedTags = books.flatMap(b => b.tags || []);
  const allTagNames = Array.from(new Set([...KNOWN_TAGS, ...allUsedTags, ...currentTags])).sort((a, b) => a.localeCompare(b, 'ja'));
  allTagNames.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip' + (currentTags.has(tag) ? ' on' : '');
    chip.textContent = tag;
    chip.onclick = () => {
      if (currentTags.has(tag)) {
        currentTags.delete(tag);
        chip.classList.remove('on');
      } else {
        if (currentTags.size >= MAX_TAGS) {
          alert(`タグは${MAX_TAGS}つまでです。外してから追加してください。`);
          return;
        }
        currentTags.add(tag);
        chip.classList.add('on');
      }
    };
    tagList.appendChild(chip);
  });

  document.getElementById('customTagInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.value.trim()) {
      const tag = normalizeTag(e.target.value.trim());
      if (currentTags.size >= MAX_TAGS) {
        alert(`タグは${MAX_TAGS}つまでです。外してから追加してください。`);
        return;
      }
      currentTags.add(tag);
      e.target.value = '';
      render();
    }
  });

  document.getElementById('prevBtn').onclick = () => { currentIndex--; render(); };
  document.getElementById('skipBtn').onclick = () => { currentIndex++; render(); };
  document.getElementById('saveNextBtn').onclick = () => saveCurrent(book, true);
  document.getElementById('deleteBtn').onclick = () => deleteCurrent(book);
}

async function deleteCurrent(book) {
  if (!confirm(`「${book.title}」を削除します。この操作は取り消せません。よろしいですか？`)) return;

  const listBefore = visibleBooks();
  const posBefore = listBefore.findIndex(b => b.filename === book.filename);
  const nextFilenameBefore = listBefore[posBefore + 1]?.filename;

  const res = await fetch(`/api/books/${encodeURIComponent(book.filename)}`, { method: 'DELETE' });
  if (!res.ok) {
    alert('削除に失敗しました');
    return;
  }

  books = books.filter(b => b.filename !== book.filename);

  const listAfter = visibleBooks();
  const idx = nextFilenameBefore ? listAfter.findIndex(b => b.filename === nextFilenameBefore) : -1;
  currentIndex = idx !== -1 ? idx : Math.min(posBefore, listAfter.length - 1);
  render();
}

function renderSidebar(list, currentBook) {
  sidebarEl.innerHTML = '';
  list.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = 'sidebar-item' + (b.filename === currentBook.filename ? ' current' : '');
    row.innerHTML = `
      <img src="${escapeAttr(b.coverUrl)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'" />
      <span class="s-title">${escapeHtml(b.title)}</span>
      <span class="s-status">${b.needsReview ? '🔲' : '✅'}</span>
    `;
    row.onclick = () => { currentIndex = i; render(); };
    sidebarEl.appendChild(row);
  });
  const currentEl = sidebarEl.querySelector('.sidebar-item.current');
  if (currentEl) currentEl.scrollIntoView({ block: 'nearest' });
}

function getSelected(name) {
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : undefined;
}

async function saveCurrent(book, advance) {
  const listBefore = visibleBooks();
  const posBefore = listBefore.findIndex(b => b.filename === book.filename);
  const nextFilenameBefore = listBefore[posBefore + 1]?.filename;

  if (currentColors.size === 0) {
    alert('mainColorを少なくとも1つ選んでください。');
    return;
  }

  const patch = {
    tags: Array.from(currentTags),
    mainColor: Array.from(currentColors),
    peopleCount: getSelected('peopleCount'),
    fontStyle: getSelected('fontStyle') ?? '',
    confirmed: true,
  };
  const res = await fetch(`/api/books/${encodeURIComponent(book.filename)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(patch),
  });
  if (!res.ok) {
    alert('保存に失敗しました');
    return;
  }
  const updated = await res.json();
  const idxInAll = books.findIndex(b => b.filename === book.filename);
  if (idxInAll !== -1) {
    books[idxInAll] = { ...books[idxInAll], ...updated, needsReview: /要確認/.test(updated.memo || '') };
  }

  if (advance) {
    // フィルターON時は確認済みになった本がリストから消えるため、
    // 保存前に「次だったはずの本」のファイル名を覚えておき、それを基準に位置を求め直す
    const listAfter = visibleBooks();
    const idx = nextFilenameBefore ? listAfter.findIndex(b => b.filename === nextFilenameBefore) : -1;
    currentIndex = idx !== -1 ? idx : Math.min(posBefore, listAfter.length - 1);
    render();
  }
}

filterToggle.addEventListener('change', () => { currentIndex = 0; render(); });

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

loadBooks();
</script>
</body>
</html>
